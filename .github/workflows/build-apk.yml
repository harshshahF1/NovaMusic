name: Build NovaMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.harshshah --project-name nova_music .
      - name: Remove generated Flutter template test
        run: rm -f test/widget_test.dart
      - name: Configure Android media service
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="nova_music"', 'android:label="NovaMusic"')
          permissions = ['android.permission.INTERNET','android.permission.FOREGROUND_SERVICE','android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK','android.permission.WAKE_LOCK']
          insert = ''.join(f'    <uses-permission android:name="{perm}" />\n' for perm in permissions if f'android:name="{perm}"' not in s)
          if insert:
              s = s.replace('\n    <application', '\n' + insert + '    <application', 1)
          marker = '        <meta-data android:name="flutterEmbedding" android:value="2" />'
          service = ('        <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" android:stopWithTask="false" />\n'
                     '        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON" /></intent-filter></receiver>\n')
          s = s.replace(marker, service + marker)
          p.write_text(s)
          PY2
      - name: Verify Audius search and a playable stream candidate
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request

          q = urllib.parse.urlencode({
              'query': 'love',
              'app_name': 'NovaMusic',
              'limit': '15',
              'offset': '0',
          })
          search_url = 'https://api.audius.co/v1/tracks/search?' + q
          req = urllib.request.Request(
              search_url,
              headers={'User-Agent': 'NovaMusic/1.0'},
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              body = json.load(r)
              status = r.status

          data = body.get('data') or []
          print('Audius search HTTP:', status, 'results:', len(data))
          if not data:
              raise SystemExit('Audius search returned zero results')

          # Audius can legitimately return 403 for individual CDN/stream candidates.
          # CI should require at least one genuinely playable candidate, not every result.
          playable = 0
          for track in data:
              track_id = str(track.get('id') or '')
              if not track_id:
                  continue

              stream = (
                  'https://api.audius.co/v1/tracks/'
                  + urllib.parse.quote(track_id, safe='')
                  + '/stream?app_name=NovaMusic'
              )

              headers = {
                  'User-Agent': 'NovaMusic/1.0',
                  'Range': 'bytes=0-4095',
              }

              try:
                  greq = urllib.request.Request(stream, headers=headers)
                  with urllib.request.urlopen(greq, timeout=20) as sr:
                      content_type = (sr.headers.get('Content-Type') or '').lower()
                      print(
                          'Stream', track_id,
                          'HTTP:', sr.status,
                          'type:', content_type,
                      )
                      if sr.status in (200, 206) and (
                          content_type.startswith('audio/')
                          or 'mpeg' in content_type
                          or 'octet-stream' in content_type
                      ):
                          playable += 1
                          print('Playable Audius stream candidate found.')
                          break
              except Exception as e:
                  # One unavailable/forbidden track must not invalidate the provider.
                  print('Candidate', track_id, 'unavailable:', e)

          if playable == 0:
              raise SystemExit('No playable Audius stream candidate was available')
          PY
      - name: Validate Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('android/app/src/main/AndroidManifest.xml').read_text()
          required = ['android.permission.INTERNET','android.permission.FOREGROUND_SERVICE','android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK','android.permission.WAKE_LOCK']
          missing = [p for p in required if p not in s]
          if missing: raise SystemExit('Missing Android permissions: ' + ', '.join(missing))
          print('Android network/media permissions validated')
          PY
      - name: Flutter pub get
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaMusic-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
